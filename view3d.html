<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D LiDAR & Path Visualizer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0e1117; color: #ffffff; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 360px; background-color: #161b22; padding: 16px; border-right: 1px solid #30363d; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; flex-shrink: 0; }
        .sidebar h2 { font-size: 1rem; color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 4px; }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .control-group label { font-size: 0.8rem; color: #c9d1d9; display: flex; justify-content: space-between; }
        .control-group input, .control-group select { width: 100%; accent-color: #1f6feb; background: #0d1117; color: white; border: 1px solid #30363d; padding: 5px; border-radius: 4px; font-size: 0.85rem; }
        .btn { background-color: #238636; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; text-decoration: none; text-align: center; }
        .btn:hover { background-color: #2ea043; }
        .btn-reset { background-color: #da3633; }
        .btn-reset:hover { background-color: #f85149; }
        .btn-play { background-color: #1f6feb; }
        .btn-play:hover { background-color: #388bfd; }
        .btn-secondary { background-color: #30363d; }
        .btn-secondary:hover { background-color: #8b949e; }
        .btn-nav { background-color: #8957e5; color: white; display: block; margin-bottom: 8px; }
        .btn-nav:hover { background-color: #a371f7; }
        
        .drag-box {
            background-color: #21262d;
            border: 2px dashed #58a6ff;
            color: #58a6ff;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: grab;
            user-select: none;
            transition: background 0.2s;
        }
        .drag-box:active { cursor: grabbing; background-color: #30363d; }

        .main-content { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        
        .telemetry-bar { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 10px; 
            height: 68px; 
            min-height: 68px; 
            max-height: 68px; 
            flex-shrink: 0;
        }
        .metric-card { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            padding: 8px 10px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            overflow: hidden;
        }
        .metric-card span.title { font-size: 0.68rem; color: #8b949e; text-transform: uppercase; white-space: nowrap; }
        .metric-card span.value { 
            font-size: 0.88rem; 
            font-weight: bold; 
            color: #58a6ff; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }

        #canvas-container { flex: 1; background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px; position: relative; min-height: 400px; }
        .button-row { display: flex; gap: 8px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="sidebar">
        <a href="/" class="btn btn-nav">🏠 Home / Landing</a>
        <a href="/2d" class="btn btn-nav">🗺️ Switch to 2D Map →</a>

        <h2>🛠️ Sensor Hardware & Control</h2>
        <div class="control-group">
            <label>LiDAR Mode</label>
            <select id="sensor_mode">
                <option value="360_sweep">360° Continuous Raycast</option>
                <option value="4_sensors">4 Discrete ToF Sensors</option>
            </select>
        </div>

        <div class="control-group" id="ray_count_group">
            <label>Sensor / Ray Count: <span id="val-beams">120</span></label>
            <input type="range" id="num_beams" min="8" max="360" step="4" value="120">
        </div>

        <div class="control-group">
            <label>Driving Speed: <span id="val-speed">0.5</span></label>
            <input type="range" id="speed" min="0.1" max="1.5" step="0.1" value="0.5">
        </div>

        <div class="control-group">
            <label>Max Distance (m): <span id="val-range">5.0</span></label>
            <input type="range" id="max_range" min="2.0" max="10.0" step="0.5" value="5.0">
        </div>

        <h2>📦 Object / Obstacle Sizer & Position</h2>
        <div class="drag-box" draggable="true" id="dragNewObs">
            ➕ Drag me onto 3D scene to drop Obstacle
        </div>

        <div class="control-group">
            <label>Selected Obstacle</label>
            <select id="obs_select"></select>
        </div>

        <div class="control-group">
            <label>Width: <span id="val-obs-width">1.00 m</span></label>
            <input type="range" id="obs_width" min="0.2" max="4.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>Height: <span id="val-obs-height">1.00 m</span></label>
            <input type="range" id="obs_height" min="0.2" max="4.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>X Center: <span id="val-obs-x">5.00 m</span></label>
            <input type="range" id="obs_x" min="0.5" max="9.5" step="0.1" value="5.0">
        </div>

        <div class="control-group">
            <label>Y Center: <span id="val-obs-y">5.00 m</span></label>
            <input type="range" id="obs_y" min="0.5" max="9.5" step="0.1" value="5.0">
        </div>

        <div class="button-row">
            <button class="btn btn-secondary" id="addObsBtn">+ Add Default</button>
            <button class="btn btn-reset" id="deleteObsBtn">Delete Selected</button>
        </div>

        <div class="button-row" style="margin-top: 10px;">
            <button class="btn btn-play" id="playBtn">Play ▶️</button>
            <button class="btn" id="stepBtn">Step ⏭️</button>
        </div>
        <button class="btn btn-reset" id="resetBtn">Reset Environment</button>
    </div>

    <div class="main-content">
        <div class="telemetry-bar">
            <div class="metric-card"><span class="title">Status</span><span class="value" id="status-val">NOMINAL</span></div>
            <div class="metric-card"><span class="title">Active Sensor Beams</span><span class="value" id="active-sensors-val">120</span></div>
            <div class="metric-card"><span class="title">Waypoints</span><span class="value" id="waypoints-val">0</span></div>
            <div class="metric-card"><span class="title">Closest Hit</span><span class="value" id="sensor-hit-val">0.00 m</span></div>
            <div class="metric-card"><span class="title">Collisions</span><span class="value" id="collisions-val">0</span></div>
        </div>

        <div id="canvas-container"></div>
    </div>

    <script>
        const ROOM_SIZE = 10.0;
        const container = document.getElementById('canvas-container');

        // Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d1117);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(5, 12, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(5, 0, 5);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Floor Grid
        const gridHelper = new THREE.GridHelper(ROOM_SIZE, 10, 0x58a6ff, 0x30363d);
        gridHelper.position.set(5, 0, 5);
        scene.add(gridHelper);

        const floorMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE),
            new THREE.MeshStandardMaterial({ color: 0x161b22, side: THREE.DoubleSide })
        );
        floorMesh.rotation.x = Math.PI / 2;
        floorMesh.position.set(5, -0.01, 5);
        scene.add(floorMesh);

        // Vehicle Mesh
        const carGroup = new THREE.Group();
        const carBody = new THREE.Mesh(
            new THREE.BoxGeometry(0.4, 0.2, 0.6),
            new THREE.MeshStandardMaterial({ color: 0xff4d4d })
        );
        carBody.position.y = 0.1;
        carGroup.add(carBody);

        const headingArrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 0.2, 0), 0.8, 0xffff00);
        carGroup.add(headingArrow);
        scene.add(carGroup);

        // Dynamic 3D Objects
        let obstacleMeshes = [];
        let rayLines = [];
        let waypointMeshes = [];
        let waypoints = [[8.5, 8.5]];
        let currentWaypointIdx = 0;
        let obstacles = [];
        let selectedObsId = null;

        let isAutoPlaying = false;
        let animationInterval = null;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function bindSlider(id, labelId, suffix = '') {
            const input = document.getElementById(id);
            const label = document.getElementById(labelId);
            input.addEventListener('input', () => label.innerText = input.value + suffix);
        }

        bindSlider('num_beams', 'val-beams');
        bindSlider('speed', 'val-speed');
        bindSlider('max_range', 'val-range', ' m');

        // Slider bindings for Obstacle Editor
        function populateObjectEditor() {
            const select = document.getElementById('obs_select');
            select.innerHTML = '';
            obstacles.forEach((obs, idx) => {
                const opt = document.createElement('option');
                opt.value = obs.id;
                opt.innerText = `Obstacle #${idx + 1} (ID: ${obs.id})`;
                if (obs.id === selectedObsId) opt.selected = true;
                select.appendChild(opt);
            });

            const current = obstacles.find(o => o.id === selectedObsId) || obstacles[0];
            if (current) {
                selectedObsId = current.id;
                const width = parseFloat((current.x_max - current.x_min).toFixed(2));
                const height = parseFloat((current.y_max - current.y_min).toFixed(2));
                const centerX = parseFloat(((current.x_min + current.x_max) / 2).toFixed(2));
                const centerY = parseFloat(((current.y_min + current.y_max) / 2).toFixed(2));

                document.getElementById('obs_width').value = width;
                document.getElementById('obs_height').value = height;
                document.getElementById('obs_x').value = centerX;
                document.getElementById('obs_y').value = centerY;

                document.getElementById('val-obs-width').innerText = width.toFixed(2) + " m";
                document.getElementById('val-obs-height').innerText = height.toFixed(2) + " m";
                document.getElementById('val-obs-x').innerText = centerX.toFixed(2) + " m";
                document.getElementById('val-obs-y').innerText = centerY.toFixed(2) + " m";
            }
        }

        async function updateObstacleFromSliders() {
            const obs = obstacles.find(o => o.id === selectedObsId);
            if (obs) {
                const width = parseFloat(document.getElementById('obs_width').value);
                const height = parseFloat(document.getElementById('obs_height').value);
                const centerX = parseFloat(document.getElementById('obs_x').value);
                const centerY = parseFloat(document.getElementById('obs_y').value);

                document.getElementById('val-obs-width').innerText = width.toFixed(2) + " m";
                document.getElementById('val-obs-height').innerText = height.toFixed(2) + " m";
                document.getElementById('val-obs-x').innerText = centerX.toFixed(2) + " m";
                document.getElementById('val-obs-y').innerText = centerY.toFixed(2) + " m";

                obs.x_min = parseFloat(Math.max(0, centerX - width / 2).toFixed(2));
                obs.x_max = parseFloat(Math.min(ROOM_SIZE, centerX + width / 2).toFixed(2));
                obs.y_min = parseFloat(Math.max(0, centerY - height / 2).toFixed(2));
                obs.y_max = parseFloat(Math.min(ROOM_SIZE, centerY + height / 2).toFixed(2));

                await syncObstacles();
                runStep();
            }
        }

        ['obs_width', 'obs_height', 'obs_x', 'obs_y'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateObstacleFromSliders);
        });

        document.getElementById('obs_select').addEventListener('change', (e) => {
            selectedObsId = parseInt(e.target.value);
            populateObjectEditor(); runStep();
        });

        document.getElementById('addObsBtn').addEventListener('click', async () => {
            const newId = Date.now();
            obstacles.push({ id: newId, x_min: 4.5, x_max: 5.5, y_min: 1.5, y_max: 2.5 });
            selectedObsId = newId;
            await syncObstacles(); populateObjectEditor(); runStep();
        });

        document.getElementById('deleteObsBtn').addEventListener('click', async () => {
            obstacles = obstacles.filter(o => o.id !== selectedObsId);
            selectedObsId = obstacles.length ? obstacles[0].id : null;
            await syncObstacles(); populateObjectEditor(); runStep();
        });

        async function syncObstacles() {
            await fetch('/api/obstacles', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ obstacles })
            });
        }

        // Drag & Drop Obstacle on 3D View
        const dragBox = document.getElementById('dragNewObs');
        dragBox.addEventListener('dragstart', (e) => e.dataTransfer.setData('text/plain', 'new_obstacle'));
        container.addEventListener('dragover', (e) => e.preventDefault());

        container.addEventListener('drop', async (e) => {
            e.preventDefault();
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floorMesh);

            if (intersects.length > 0) {
                const pt = intersects[0].point;
                const newId = Date.now();
                const w = 1.0, h = 1.0;

                obstacles.push({
                    id: newId,
                    x_min: Math.max(0, parseFloat((pt.x - w/2).toFixed(2))),
                    x_max: Math.min(ROOM_SIZE, parseFloat((pt.x + w/2).toFixed(2))),
                    y_min: Math.max(0, parseFloat((pt.z - h/2).toFixed(2))),
                    y_max: Math.min(ROOM_SIZE, parseFloat((pt.z + h/2).toFixed(2)))
                });

                selectedObsId = newId;
                await syncObstacles();
                populateObjectEditor();
                runStep();
            }
        });

        async function runStep() {
            if (isDraggingObs3D) return;
            const payload = {
                speed: parseFloat(document.getElementById('speed').value),
                num_beams: parseInt(document.getElementById('num_beams').value),
                max_range: parseFloat(document.getElementById('max_range').value),
                safety_margin: 1.2,
                sensor_mode: document.getElementById('sensor_mode').value,
                waypoints: waypoints,
                current_waypoint_idx: currentWaypointIdx
            };

            try {
                const response = await fetch('/api/step', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (data.obstacles) obstacles = data.obstacles;
                if (!selectedObsId && obstacles.length) selectedObsId = obstacles[0].id;
                populateObjectEditor();

                currentWaypointIdx = data.current_waypoint_idx;
                document.getElementById('status-val').innerText = data.status;
                document.getElementById('active-sensors-val').innerText = data.active_sensor_count;
                document.getElementById('waypoints-val').innerText = `${currentWaypointIdx}/${waypoints.length}`;
                document.getElementById('sensor-hit-val').innerText = (data.min_sensor_hit || 0.0).toFixed(2) + " m";
                document.getElementById('collisions-val').innerText = data.collisions;

                update3DScene(data);
            } catch (err) {
                console.error("3D Step execution error:", err);
            }
        }

        function update3DScene(data) {
            // Update Car Position & Orientation
            carGroup.position.set(data.car_x, 0, data.car_y);
            carGroup.rotation.y = -data.car_heading + Math.PI / 2;

            // Render Obstacles
            obstacleMeshes.forEach(m => scene.remove(m));
            obstacleMeshes = [];

            data.obstacles.forEach(obs => {
                const w = obs.x_max - obs.x_min;
                const d = obs.y_max - obs.y_min;
                const h = 1.2;

                const geo = new THREE.BoxGeometry(w, h, d);
                const mat = new THREE.MeshStandardMaterial({
                    color: obs.id === selectedObsId ? 0xff7800 : 0x8b0000,
                    transparent: true,
                    opacity: 0.85
                });

                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(obs.x_min + w / 2, h / 2, obs.y_min + d / 2);
                scene.add(mesh);
                obstacleMeshes.push(mesh);
            });

            // Render LiDAR Rays
            rayLines.forEach(l => scene.remove(l));
            rayLines = [];

            const rayMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 });
            data.all_rays.forEach(r => {
                const points = [
                    new THREE.Vector3(data.car_x, 0.1, data.car_y),
                    new THREE.Vector3(r.end_x, 0.1, r.end_y)
                ];
                const geo = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geo, rayMat);
                scene.add(line);
                rayLines.push(line);
            });

            // Render Waypoint Markers
            waypointMeshes.forEach(w => scene.remove(w));
            waypointMeshes = [];

            waypoints.forEach((wp, idx) => {
                const geo = new THREE.SphereGeometry(0.15, 16, 16);
                const mat = new THREE.MeshBasicMaterial({ color: idx === currentWaypointIdx ? 0xffbd2e : 0x888888 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(wp[0], 0.15, wp[1]);
                scene.add(mesh);
                waypointMeshes.push(mesh);
            });
        }

        function togglePlay() {
            isAutoPlaying = !isAutoPlaying;
            const playBtn = document.getElementById('playBtn');
            if (isAutoPlaying) {
                playBtn.innerText = "Pause ⏸️";
                playBtn.style.backgroundColor = "#d29922";
                animationInterval = setInterval(runStep, 100);
            } else {
                playBtn.innerText = "Play ▶️";
                playBtn.style.backgroundColor = "#1f6feb";
                clearInterval(animationInterval);
            }
        }

        document.getElementById('stepBtn').addEventListener('click', runStep);
        document.getElementById('playBtn').addEventListener('click', togglePlay);
        document.getElementById('resetBtn').addEventListener('click', async () => {
            if (isAutoPlaying) togglePlay();
            await fetch('/api/reset', { method: 'POST' });
            runStep();
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
        runStep();
    </script>
</body>
</html>
